name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Verify protected original artwork
        run: python3 tools/protect_card_art.py
      - name: Build React game and offline assets
        run: npm run build
      - name: Install pinned browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify production runtime, saves, offline delivery and presentation
        env:
          BROWSER_CHANNEL: chromium
          GAME_URL: http://127.0.0.1:8773/Solitaire-And-Friends/
        run: |
          npm run preview -- --port 8773 > /tmp/solitaire-preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent "$GAME_URL" > /dev/null && break; sleep 1; done
          node tools/verify-production.cjs
      - name: Retain verification captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: evidence/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
