<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Solitaire — Solitaire and Friends</title>
<meta name="description" content="Klondike Solitaire — tap to play, smooth and ad-free.">
<meta name="theme-color" content="#0b6b40">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../styles/app.css">
<link rel="stylesheet" href="solitaire.css">
<link rel="stylesheet" href="../../assets/css/deck-prefs.css">
<link rel="stylesheet" href="../../assets/css/game-comfort.css">
<link rel="stylesheet" href="screen.css">
</head>
<body>
<div id="solLoad" class="sol-load" role="status" aria-label="Loading">
  <img class="sol-load-logo" src="../../assets/title-320.webp" width="320" height="175" alt="Solitaire and Friends" decoding="async">
  <div class="sol-load-spinner" aria-hidden="true"></div>
  <p class="sol-load-text">Shuffling the deck&hellip;</p>
</div>
<main class="game-screen">
<div class="game-tools"><a href="../../" aria-label="Back to games">‹</a><div class="game-hud"><span id="timer">0:00</span><span id="moves">0 moves</span><span id="progress">0 / 52</span></div><button id="openMenu" aria-label="Open game menu">☰</button></div>
<div class="board-wrap"><div id="board" class="board" role="region" aria-label="Solitaire table"></div></div>
<div class="hint-strip"><p id="hintText" class="hint-text" role="status" aria-live="polite">Tap or drag a card</p><button id="playHint" class="btn candy" hidden>Play move</button></div>
<div class="game-actions"><button id="hintBtn" class="btn candy">✦ Hint</button><button id="rewindBtn" class="btn ghost" aria-label="Undo last move" disabled>↶ Undo <span id="rewindCount"></span></button><button id="timeReverse" class="btn reverse">⏪ Reverse <span id="reverseCount">3 left</span></button></div>
</main>
<dialog id="gameMenu"><div class="menu-heading"><h2>Your game</h2><button id="closeMenu" class="btn" aria-label="Close menu">Done</button></div><div class="menu-grid">
<button id="newGame">New deal</button><button id="restartBtn">Restart deal</button><button id="dailyBtn">Daily deal</button>
<label>Draw <select id="drawMode" aria-label="Cards per draw"><option value="1">1 card</option><option value="3">3 cards</option></select></label>
<label>Deck <select id="deckSide" aria-label="Draw deck side"><option value="right">Right</option><option value="left">Left</option></select></label>
<button id="shuffleBtn">Magic shuffle <span id="shuffleCount">x1</span></button><button id="autoBtn">Auto-finish</button>
<a href="statistics.html">Scores</a><button data-share-game>Share game</button><button id="menuSettings" data-settings>Settings</button></div><p id="stats"></p></dialog>
<div id="win" class="win">
  <div class="panel">
    <div class="big">&#127942;</div>
    <h1>You win!</h1>
    <p>Cleared in <span id="winMoves">0</span> moves</p>
    <button id="winNew" class="btn">New game</button>
    <button data-share-game="score" class="btn">Share my best score</button><p id="shareStatus" role="status"></p>
<p><a href="statistics.html">See your scores</a></p>
  </div>
</div>


<script>setTimeout(function(){var l=document.getElementById('solLoad');if(l)l.classList.add('gone');},7000);</script>
<script src="../../assets/js/deck-prefs.js"></script>
<script type="module" src="../../assets/js/music.js"></script>
<script type="module" src="../../assets/js/settings.js"></script>
<script type="module" src="../../assets/js/share.js"></script>
<script type="module" src="solitaire.js"></script>
<script type="module" src="screen.js"></script>
<script type="module" src="../../assets/js/sw-register.js"></script>

<script type="module" src="../../assets/js/game-surface.js"></script>
</body>
</html>
